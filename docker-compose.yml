services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: zikra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: zikra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zikra -d zikra"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:main-latest@sha256:1aa6227ab85b21b3959b0ce4fc21ddbe64170d12a85b33c726ca5b22dc41e87a
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:1234/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local-development}
      EMBEDDING_UPSTREAM_MODEL: ${EMBEDDING_UPSTREAM_MODEL:-google/embedding-gemma-300m}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 5s
      timeout: 5s
      retries: 30

  zikra:
    build:
      context: .
      dockerfile: Dockerfile.zikra
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      ZIKRA_TOKEN: ${ZIKRA_TOKEN:?ZIKRA_TOKEN must be set}
      ZIKRA_SKIP_ONBOARDING: "1"
      ZIKRA_HOST: 0.0.0.0
      ZIKRA_PORT: "8377"
      ZIKRA_PROJECT: main
      DB_BACKEND: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: zikra
      DB_USER: zikra
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${EMBEDDING_API_KEY:-local-development}
      ZIKRA_EMBEDDING_MODEL: ${ZIKRA_EMBEDDING_MODEL:-local-embedding}
      ZIKRA_EMBEDDING_DIMENSIONS: ${ZIKRA_EMBEDDING_DIMENSIONS:-768}
    ports:
      - "127.0.0.1:8377:8377"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8377/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
